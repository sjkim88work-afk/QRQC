# Windows 프로그램(QRQC 폴더 · QRQC.exe) 자동 빌드 — QIS 데스크톱과 같은 폴더 방식
# - Pull Request: 빌드 + 실행 점검만 (결과 zip 은 Actions 실행 화면의 Artifacts에서 받을 수 있음)
# - main 병합: 빌드 + 실행 점검 + Releases에 v<버전> 으로 QRQC-windows.zip 게시
#   최신 zip 고정 주소: https://github.com/<owner>/<repo>/releases/latest/download/QRQC-windows.zip
name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build dist\QRQC\QRQC.exe
        run: python -m PyInstaller --noconfirm --clean packaging/QRQC.spec

      - name: Self test (server, screen, database, attachment, program window components)
        shell: pwsh
        run: |
          function Invoke-SelfTest($exe, $out) {
            $p = Start-Process -FilePath $exe -ArgumentList '--selftest', $out -PassThru
            if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; Write-Host 'selftest did not exit in 180 s' }
            if (Test-Path $out) { Get-Content $out -Encoding utf8 | Out-Host } else { Write-Host 'no selftest output' }
            return $p.ExitCode
          }
          $code = Invoke-SelfTest 'dist\QRQC\QRQC.exe' "$PWD\selftest.json"
          if ($code -ne 0) { throw "selftest failed (exit $code)" }

      - name: Self test as a zip downloaded from the internet (Mark-of-the-Web on every file)
        shell: pwsh
        run: |
          Copy-Item -Recurse dist\QRQC motw\QRQC
          # QRQC.exe 는 사람이 SmartScreen [실행]으로 넘기는 부분이라 빼고, 나머지 모든 파일에 '인터넷에서 받은 파일' 표시
          Get-ChildItem motw\QRQC -Recurse -File | Where-Object { $_.Name -ne 'QRQC.exe' } | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          # 1) 보정 없이: 회사 PC 오류가 재현되는지 (정보용)
          $env:QRQC_NO_UNBLOCK = '1'
          $p = Start-Process -FilePath 'motw\QRQC\QRQC.exe' -ArgumentList '--selftest', "$PWD\motw_off.json" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force }
          Write-Host "without unblock: exit $($p.ExitCode) (non-zero = reproduced)"
          Remove-Item Env:QRQC_NO_UNBLOCK
          # 2) 보정 켜고: 반드시 통과 + 표시가 지워졌는지
          $p = Start-Process -FilePath 'motw\QRQC\QRQC.exe' -ArgumentList '--selftest', "$PWD\motw_on.json" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; Write-Host 'selftest did not exit in 180 s' }
          Get-Content motw_on.json -Encoding utf8 | Out-Host
          if ($p.ExitCode -ne 0) { throw "selftest with Mark-of-the-Web failed (exit $($p.ExitCode))" }
          $left = Get-ChildItem motw\QRQC -Recurse -Filter *.dll | Where-Object { Get-Item $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }
          if ($left) { throw "DLLs still marked: $($left.Count)" }

      - name: Check manifest asks for no administrator rights
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('dist\QRQC\QRQC.exe')
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match 'requireAdministrator|highestAvailable') { throw 'manifest requests elevation' }
          if ($text -notmatch 'asInvoker') { throw 'asInvoker manifest not found' }
          Write-Host 'OK: requestedExecutionLevel = asInvoker'

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path 'dist\QRQC' -DestinationPath 'QRQC-windows.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: QRQC-windows
          path: QRQC-windows.zip
          retention-days: 14

      - name: Publish to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path app.py -Pattern "^VERSION = '(.+)'").Matches[0].Groups[1].Value
          $tag = "v$ver"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $notes = "Windows 프로그램 QRQC-windows.zip (Python 설치 불필요) · 빌드 $sha`n`n압축을 풀고 QRQC 폴더 안의 QRQC.exe 를 실행하세요. QRQC.exe 만 따로 옮기지 말고 폴더째 두세요."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag QRQC-windows.zip --clobber
            gh release edit $tag --notes $notes
          } else {
            gh release create $tag QRQC-windows.zip --target "${{ github.sha }}" --title "QRQC $tag" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'release publish failed' }
