# Windows 실행 파일(QRQC_Tracker.exe) 자동 빌드
# - Pull Request: 빌드 + 실행 시험만 (결과 exe는 Actions 실행 화면의 Artifacts에서 받을 수 있음)
# - main 병합: 빌드 + 실행 시험 + Releases에 v<버전> 으로 게시
#   최신 exe 고정 주소: https://github.com/<owner>/<repo>/releases/latest/download/QRQC_Tracker.exe
name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build QRQC_Tracker.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name QRQC_Tracker --add-data "web;web" app.py

      - name: Smoke test (start exe, create database, save and read an issue)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'qrqc_test'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'appdata'
          $p = Start-Process -FilePath 'dist\QRQC_Tracker.exe' -ArgumentList '--headless','--port','8790','--data',$data -PassThru
          $base = 'http://127.0.0.1:8790'
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try { $null = Invoke-RestMethod "$base/api/config"; $ok = $true; break } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw 'exe did not start' }
          $html = Invoke-WebRequest "$base/" -UseBasicParsing
          if ($html.Content -notmatch '공정품질 신속대응회의') { Stop-Process -Id $p.Id -Force; throw 'screen not served' }
          $body = @{ no = 'CI-001'; date = '2026-01-01'; part = 'CI'; owner = 'ci'; issue = 'smoke test'; crit = @{ cont = 'G' } } | ConvertTo-Json -Depth 4
          $null = Invoke-RestMethod -Method Put -Uri "$base/api/issues/ci-1" -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType 'application/json; charset=utf-8'
          $all = Invoke-RestMethod "$base/api/all"
          Stop-Process -Id $p.Id -Force
          if ($all.issues.Count -ne 1 -or $all.issues[0].crit.cont -ne 'G') { throw 'issue round-trip failed' }
          if (-not (Test-Path (Join-Path $data 'qrqc.db'))) { throw 'database not created' }
          Write-Host "OK: issue saved and read back, database at $($all.db.path)"

      - uses: actions/upload-artifact@v4
        with:
          name: QRQC_Tracker
          path: dist/QRQC_Tracker.exe
          retention-days: 14

      - name: Publish to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path app.py -Pattern "^VERSION = '(.+)'").Matches[0].Groups[1].Value
          $tag = "v$ver"
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/QRQC_Tracker.exe --clobber
            gh release edit $tag --notes "QRQC_Tracker.exe (Windows, Python 설치 불필요) · 마지막 빌드 $sha"
          } else {
            gh release create $tag dist/QRQC_Tracker.exe --target "${{ github.sha }}" --title "QRQC Tracker $tag" --notes "QRQC_Tracker.exe (Windows, Python 설치 불필요) · 빌드 $sha`n`n다운로드한 exe를 더블클릭해 실행하세요. 처음 실행할 때 데이터 폴더(공유폴더 권장)를 지정합니다."
          }
          if ($LASTEXITCODE -ne 0) { throw 'release publish failed' }
